server.port=8080
spring.application.name=API-GATEWAY

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ================= AUTH SERVICE =================

# LOGIN / REGISTER / RESET PASSWORD
spring.cloud.gateway.routes[0].id=auth-service-auth
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# ADMIN ROUTES
spring.cloud.gateway.routes[1].id=auth-service-admin
spring.cloud.gateway.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/admin/**

# ================= USER SERVICE =================

spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/users/**

# ================= EXPENSE SERVICE =================

spring.cloud.gateway.routes[3].id=expense-service
spring.cloud.gateway.routes[3].uri=lb://EXPENSE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/expenses/**

# ================= REPORT SERVICE =================

spring.cloud.gateway.routes[4].id=report-service
spring.cloud.gateway.routes[4].uri=lb://REPORT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/report/**

# ================= CATEGORY SERVICE =================

spring.cloud.gateway.routes[5].id=category-service
spring.cloud.gateway.routes[5].uri=lb://CATEGORY-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/categories/**

# ================= NOTIFICATION SERVICE =================

spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/notifications/**

# ================= ACTUATOR =================

management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true

# ================= LOGGING =================

logging.level.org.springframework.cloud.gateway=DEBUG

# ================= SWAGGER =================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true